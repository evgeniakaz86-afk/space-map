<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><b>Вход организатора</b></header>
<main class="center">
  <form id="loginForm" class="panel" autocomplete="on">
    <label>Логин
      <input id="l" name="login" autocomplete="username" required>
    </label>
    <label>Пароль
      <input id="p" name="pass" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Войти</button>
    <p id="err" class="err" role="alert"></p>
    <p class="hint">Демо: admin / admin</p>
  </form>
</main>
<script src="js/auth.js"></script>
</body>
</html>
