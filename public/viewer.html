<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр карты</title>
    
    <!-- Библиотека для 3D-панорам -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Принудительно делаем текст в выпадающих списках темным (чтобы было видно на белом фоне) */
        select, option {
            color: #000 !important;
            background-color: #fff !important;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>Просмотр карты</span>
            </div>
        </header>

        <main class="app-main">
            <!-- БЛОК 1: 2D-КАРТА -->
            <section class="glass-panel">
                <div class="panel-header">
                    <h2>Схема объекта</h2>
                </div>

                <div class="toolbar">
                    <select id="locSelect" onchange="switchLoc()" class="custom-select"></select>
                    <select id="floorSelect" onchange="switchFloor()" class="custom-select"></select>
                </div>

                <div id="mapArea" class="map-container" style="margin-top: 20px;">
                    <img id="planImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="План">
                    <svg id="routeSvg"></svg>
                    <div id="tooltip" class="custom-tooltip"></div>
                </div>

                <div class="route-panel">
                    <h3>Проложить маршрут</h3>
                    <div class="toolbar">
                        <div class="select-group">
                            <span class="label">Откуда:</span>
                            <select id="startPoint" class="custom-select"></select>
                        </div>
                        <div class="select-group">
                            <span class="label">Куда:</span>
                            <select id="endPoint" class="custom-select"></select>
                        </div>
                    </div>
                    <div class="toolbar" style="margin-top: 16px;">
                        <button onclick="drawRoute()" class="btn btn-primary">Проложить</button>
                        <button onclick="clearRoute()" class="btn btn-secondary">Сбросить</button>
                    </div>
                </div>
            </section>

            <!-- БЛОК 2: 3D-ПАНОРАМЫ -->
            <section class="glass-panel">
                <div class="panel-header">
                    <h2>3D Панорамы</h2>
                </div>
                <ul id="panoList" class="pano-list"></ul>
            </section>
        </main>
    </div>

    <!-- 3D ОКНО -->
    <div id="panoramaView" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:1000;">
        <button class="close-pano" onclick="closePano()" style="position:absolute; top:24px; right:24px; z-index:1010;">Закрыть 3D</button>
        <div id="panoContainer" style="width:100%; height:100%;"></div>
    </div>

    <!-- Подключаем viewer.js -->
    <script src="js/viewer.js"></script>
</body>
</html>
